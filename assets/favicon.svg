<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 100 100"
  width="512"
  height="512"
  role="img"
  aria-label="Own Goal Studio soccer ball"
>
  <defs>
    <clipPath id="ball">
      <circle cx="50" cy="50" r="46" />
    </clipPath>
  </defs>

  <g clip-path="url(#ball)">
